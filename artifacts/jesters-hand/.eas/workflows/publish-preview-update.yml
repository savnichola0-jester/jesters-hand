name: Send Android fixes to the existing preview app

defaults:
  tools:
    node: '20.18.0'
    pnpm: '10.26.1'

on:
  workflow_dispatch: {}

jobs:
  publish_android_update:
    name: Publish Android preview update
    type: update
    environment: preview
    params:
      platform: android
      channel: preview
      message: Jester's Hand games and current Android fixes
    hooks:
      before_update:
        - run: node scripts/prepare-preview-update-env.mjs